apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: board
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # SQLite on one ReadWriteOnce disk, and a scheduler in the process: never two replicas.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: board
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: board
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- $image := printf "%v:%v" .Values.image.repository .Values.image.tag }}
        {{- $published := and (eq (toString .Values.image.publishedImage) $image) .Values.image.publishedDigest }}
        - name: board
          image: "{{ $image }}{{ with .Values.image.digest | default $published }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOARD_PUBLIC_URL
              value: {{ include "board.url" . | quote }}
            - name: AUTHKIT_ISSUER
              value: {{ required "authkitIssuer is required" .Values.authkitIssuer | quote }}
            - name: TEAM_DOMAIN
              value: {{ required "teamDomain is required" .Values.teamDomain | quote }}
            {{- with .Values.authkitClientId }}
            - name: AUTHKIT_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.signInLabel }}
            - name: SIGN_IN_LABEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sync.gitlab.apiUrl }}
            - name: GITLAB_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sync.gitlab.excludedPaths }}
            - name: GITLAB_EXCLUDE
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.sync.gchat.projectNumber }}
            - name: GOOGLE_CHAT_PROJECT_NUMBER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sync.gchat.botUserId }}
            - name: GOOGLE_CHAT_BOT_USER_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sync.gchat.spaces }}
            - name: GOOGLE_CHAT_SPACES
              value: {{ include "board.spaces" . | quote }}
            {{- end }}
            {{- with .Values.sync.triageChannel }}
            - name: BOARD_TRIAGE_CHANNEL
              value: {{ . | quote }}
            {{- end }}
          {{- if or .Values.sync.gitlab.secretName .Values.sync.gchat.secretName }}
          envFrom:
            {{- range list .Values.sync.gitlab.secretName .Values.sync.gchat.secretName }}
            {{- if . }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            # SQLite's temporary files, on a read-only root.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir: {}
